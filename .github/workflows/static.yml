# Build WASM dari source C++ lalu deploy aplikasi web statis ke GitHub Pages.
# Artefak route_planner_wasm.js/.wasm di-build ulang setiap push sehingga
# deployment selalu sinkron dengan kode terbaru (tanpa build manual lokal).
name: Build WASM & Deploy to Pages

on:
  # Runs on pushes targeting the default branch (dokumen tidak memicu build)
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WASM from C++ sources
        run: |
          emcc --version
          emcmake cmake -S template/wasm -B template/wasm/build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build template/wasm/build-ci --parallel
          ls -la template/wasm/route_planner_wasm.js template/wasm/route_planner_wasm.wasm

      # POST_BUILD di template/wasm/CMakeLists.txt otomatis menyalin artefak
      # hasil build ke template/wasm/, sehingga yang di-upload sudah segar.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'template'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
